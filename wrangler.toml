name = "braindrop-ai-proxy"
main = "cloudflare-worker-proxy.js"
compatibility_date = "2026-03-17"

[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "braindrop-library"

[observability]
enabled = true

[observability.logs]
enabled = true

# Secrets (set via: npx wrangler secret put <NAME>)
# Required:
#   ANTHROPIC_API_KEY
#   GEMINI_API_KEY
#   GROQ_API_KEY
#   NVIDIA_API_KEY
